<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학 게임 컬렉션 | Math Game Collection</title>
  <meta name="description" content="수학적 최적화를 게임으로! 시소 밸런스, 배달의 신 최단경로 챌린지">
  <meta property="og:title" content="수학 게임 컬렉션">
  <meta property="og:description" content="수학적 최적화를 게임으로 즐겨보세요!">
  <meta property="og:type" content="website">
  <meta property="og:image" content="og-portal.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #F8F9FA;
      color: #212529;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }
    .hero-icon { font-size: 48px; margin-bottom: 12px; }
    .hero-title {
      font-size: 28px; font-weight: 900; margin-bottom: 6px;
      background: linear-gradient(135deg, #4C6EF5, #FD7E14);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub { font-size: 15px; color: #868E96; margin-bottom: 36px; }
    .games { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
    .game-card {
      background: #FFF; border: 2px solid #DEE2E6; border-radius: 16px;
      padding: 28px 20px; text-decoration: none; color: inherit;
      transition: all 0.2s; display: flex; flex-direction: column; align-items: center;
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      border-color: #4C6EF5;
    }
    .game-card .card-icon { font-size: 48px; margin-bottom: 12px; }
    .game-card .card-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .game-card .card-desc { font-size: 13px; color: #868E96; line-height: 1.6; margin-bottom: 16px; }
    .game-card .card-btn {
      background: #4C6EF5; color: #FFF; border: none; border-radius: 8px;
      padding: 10px 24px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: background 0.15s;
    }
    .game-card:nth-child(2) .card-btn { background: #FD7E14; }
    .game-card .card-btn:hover { filter: brightness(0.9); }
    .game-card .card-tags {
      display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center;
    }
    .tag {
      font-size: 10px; padding: 3px 8px; border-radius: 10px;
      background: #F1F3F5; color: #868E96; font-weight: 600;
    }
    .footer {
      font-size: 12px; color: #ADB5BD; line-height: 1.8;
    }
    @media (max-width: 500px) {
      .games { grid-template-columns: 1fr; }
      .hero-title { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero-icon">&#x1F3B2;</div>
    <h1 class="hero-title">수학 게임 컬렉션</h1>
    <p class="hero-sub">수학적 최적화 문제를 게임으로 즐겨보세요!</p>

    <div class="games">
      <a href="seesaw-game/" class="game-card">
        <div class="card-icon">&#x2696;</div>
        <div class="card-title">시소 밸런스</div>
        <div class="card-tags">
          <span class="tag">Partition Problem</span>
          <span class="tag">Puzzle</span>
        </div>
        <div class="card-desc">양쪽 숫자의 합을 같게 맞춰라!<br>균형 감각을 테스트하는 퍼즐</div>
        <button class="card-btn">플레이</button>
      </a>

      <a href="tsp-game/" class="game-card">
        <div class="card-icon">&#x1F69A;</div>
        <div class="card-title">배달의 신</div>
        <div class="card-tags">
          <span class="tag">TSP</span>
          <span class="tag">Shortest Path</span>
        </div>
        <div class="card-desc">최단경로를 찾아 배달 완료!<br>최적 경로 대비 점수 도전</div>
        <button class="card-btn">플레이</button>
      </a>
    </div>

    <div class="footer">
      Math Game Collection<br>
      Powered by Mathematical Optimization
    </div>
  </div>
</body>
</html>
